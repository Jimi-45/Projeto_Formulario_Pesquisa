<!DOCTYPE html>
<html lang="port-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Diario</title>
</head>
<body>
    <header>
        <img src="Artes/Logo (2).png" alt="">
        <img src="Artes/Personal_Diario.png" alt="">
    </header>
    <form action="">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="name">Nome</label>
            <input type="text" id="name" name="nome" required>
            <label for="Lname">Sobrenome</label>
            <input type="text" id="Lname" name="sobrenome" required>
            <label for="age">Idade</label>
            <input type="number" id="age" name="idade">
            <label for="nasc">Data de Nascimento</label>
            <input type="date" id="nasc" name="data_de_nascimento"><br>
        </fieldset>
        <fieldset>    
            <legend>Endereço</legend>
            <label for="address">Endereço</label>
            <input type="text" id="adress" required>
            <label for="Codigo_postal">Cep</label>
            <input type="number" id="Codigo_postal">
            <label for="neighborhood">Bairro</label>
            <input type="text" id="neighborhood">
            <label for="city">Cidade</label>
            <input type="text" id="city">
            <label for="state">Estado</label>
            <select name="Estado" id="state">
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="ES">Espirito Santo</option>
                <option value="MG">Minas Gerais</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="AM">Amazonas</option>
                <option value="PA">Pará</option>
                <option value="TO">Tocantins</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="PE">Pernambuco</option>
                <option value="SE">Sergipe</option>
                <option value="DF">Distrito Federal</option>
                <option value="RR">Roraima</option>
                <option value="MA">Maranhão</option>
                <option value="AP">Amapá</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="BA">Bahia</option>
                <option value="SC">Santa Catarina</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MT">Rio Grande do Sul</option>
                <option value="GO">Goias</option>
                <option value="RO">Rondônia</option>
                <option value="CE">Ceará</option>
                <option value="PB">Paraíba</option>
                <option value="PI">Piaui</option>
            </select><br>
        </fieldset>
        <fieldset>   
            <legend>Contato</legend>
            <label for="Phone">Telefone</label>
            <input type="tel" id="Phone" name="telefone">
            <label for="Cel">Celular</label>
            <input type="tel" id="Cel" name="celular"><br>
            <label for="Correio">E-mail</label>
            <input type="email" id="Correio" name="email"><br>
            <label for="repositorio">Github</label>
            <input type="url" id="repositorio" name="github">
            <label for="empregos">LinkeDin</label>
            <input type="url" id="empregos" name="linkedin">
        </fieldset>
        <fieldset>   
            <legend>Sexo</legend>
            <input type="radio" id="masc" name="sexo" value="masculino">
            <label for="masc">Masculino</label>
            <input type="radio" id="fem" name="sexo" value="feminino">
            <label for="fem">Feminino</label>
            <input type="radio" id="omit" name="sexo" value="prefiro_nao_responder">
            <label for="omit">Prefiro não responder</label>
        </fieldset>
        <fieldset>
            <legend>Estado Civil</legend>
            <input type="radio" id="casad" name="estado_civil" value="casado">
            <label for="casad">Casado</label>
            <input type="radio" id="solt" name="estado_civil" value="solteiro">
            <label for="solt">Solteiro</label>
            <input type="radio" id="div" name="estado_civil" value="divorciado">
            <label for="div">Divorciado</label>
            <input type="radio" id="sep" name="estado_civil" value="separado">
            <label for="sep">Separado</label>
            <input type="radio" id="uniao" name="estado_civil" value="uniao_estavel">
            <label for="uniao">União Estável</label>
            <input type="radio" id="omit" name="estado_civil" value="prefiro_nao_responder">
            <label for="omit">Prefiro não responder</label>
        </fieldset>
        <fieldset>
            <legend>Preferência de Filmes</legend>
            <input type="checkbox" id="dram" name="preferencias" value="drama">
            <label for="dram">Drama</label>
            <input type="checkbox" id="com" name="preferencias" value="comedia">
            <label for="com">Comédia</label>
            <input type="checkbox" id="sus" name="preferencias" value="suspense">
            <label for="sus">Suspense</label>
            <input type="checkbox" id="act" name="preferencias" value="acao">
            <label for="act">Ação</label>
            <input type="checkbox" id="ter" name="preferencias" value="terror">
            <label for="ter">Terror</label>
            <input type="checkbox" id="ave" name="preferencias" value="aventura">
            <label for="ave">Avetura</label>
            <input type="checkbox" id="omit" name="preferencias" value="nao_gosto_de_filmes">
            <label for="omit">Não gosto de filmes</label>
        </fieldset>
        <fieldset>
            <legend>Preferência de Jogos</legend>
            <input type="radio" id="yes" name="jogo" value="sim">
            <label for="yes">Sim</label>
            <input type="radio" id="no" name="jogo" value="nao">
            <label for="no">Não</label><br>
            <label for="game">Digite o Nome do Jogo Preferido:</label><br>
            <input type="text" id="game" name="nome_do_jogo" value="">
        </fieldset>
        <fieldset>
            <legend>Preferência de Esportes</legend>
            <input type="radio" id="yes" name="esporte" value="sim">
            <label for="yes">Sim</label>
            <input type="radio" id="no" name="esporte" value="nao">
            <label for="no">Não</label><br>
            <label for="esportivo">Digite o Nome do Esporte Preferido:</label><br>
            <input type="text" id="esportivo" name="nome_do_esporte" value="">
        </fieldset>
        
    </form>
</body>
</html>
